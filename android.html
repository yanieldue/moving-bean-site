<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bean on Android</title>
<meta name="description" content="Bean is on Android. Get it free on Google Play.">
<link rel="canonical" href="https://www.moving-bean.com/android.html">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{--peach:#f3c79b;--cream:#fffdf3;--ink:#1c1a17;--muted:#6b6258;--line:#1c1a17;--butter:#fbe7a6;--grass:#7cc06a;--grass-deep:#5a9a4c;--error:#b3432b}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);background:var(--peach);line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
  .px{image-rendering:pixelated;image-rendering:crisp-edges}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px;width:100%}
  header .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:14px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:2px;color:var(--ink);text-decoration:none}
  .logo img{width:40px;height:40px;margin:-13.75px -10.6px 0 -10.6px} /* sprite fills x34-93, y44-127 of its 128 canvas: trim the padding so Bean centres on the wordmark */
  header nav a{color:var(--ink);text-decoration:none;font-size:14px;font-weight:700}
  main{flex:1;display:flex;align-items:center;padding:24px 0 64px}
  .panel{max-width:560px;margin:0 auto;text-align:center}
  .buddies{display:flex;justify-content:center;gap:18px;margin-bottom:18px}
  .buddies img{width:96px;height:96px;animation:bob 3.6s ease-in-out infinite}
  .buddies img:last-child{animation-delay:-1.8s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .tag{display:inline-block;background:var(--ink);color:var(--cream);font-size:12px;font-weight:800;letter-spacing:1.5px;padding:5px 12px;border-radius:999px;margin-bottom:14px}
  h1{font-size:clamp(30px,6vw,46px);line-height:1.08;margin:0 0 14px;letter-spacing:-.5px}
  p.lead{color:var(--muted);font-size:17px;margin:0 auto 26px;max-width:480px}
  .card{background:var(--cream);border:2px solid var(--line);border-radius:20px;padding:22px;box-shadow:5px 5px 0 var(--line);text-align:left}
  .badge{display:inline-flex;align-items:center;gap:12px;text-align:left;background:var(--ink);color:var(--cream);font-weight:800;font-size:15px;padding:11px 20px;border-radius:14px;border:2px solid var(--ink);text-decoration:none}
  .badge .icon{width:40px;height:40px;flex:none;border-radius:9px}
  .badge .sub{display:block;font-size:11px;font-weight:600;opacity:.7;letter-spacing:1px;margin-top:2px}
  .small{color:var(--muted);font-size:13px}
  .store{display:inline-block;width:162px;height:54px}
  .store img{display:block;width:162px;height:54px}
  .stores{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
  .store.gplay{display:flex;align-items:center;gap:6px;padding:0 8px 0 10px;text-align:left;white-space:nowrap;border-radius:12px;background:#fff;color:#000;border:1.5px solid #000;text-decoration:none;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
  .store.gplay .gp{flex:none;width:26px;height:29px;margin-right:2px}
  .store.gplay small{display:block;font-size:8.5px;font-weight:600;letter-spacing:.3px;line-height:1.15}
  .store.gplay b{display:block;font-size:18.5px;font-weight:600;letter-spacing:-.5px;line-height:1.1}
  .small a,.card a{color:var(--ink)}
  footer{background:var(--grass-deep);color:var(--cream);padding:22px 0 30px;text-align:center}
  footer a{color:var(--cream);font-weight:700;text-decoration:none;margin:0 10px}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

  form{display:flex;flex-direction:column;gap:12px}
  label{font-weight:800;font-size:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  input[type=email]{flex:1;min-width:0;font:inherit;font-size:16px;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  input[type=email]:focus{outline:3px solid var(--butter);outline-offset:1px}
  button{font:inherit;font-weight:800;font-size:15px;padding:13px 20px;border-radius:12px;border:2px solid var(--ink);background:var(--ink);color:var(--cream);cursor:pointer;box-shadow:4px 4px 0 rgba(28,26,23,.25)}
  button:hover{transform:translate(-1px,-1px)}
  .hp{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
  .msg{display:none;color:var(--error);font-weight:700;font-size:14px;margin:0}
  .msg:target{display:block;margin-bottom:12px}
  .or{margin:30px 0 12px}
  @media (max-width:420px){ .row{flex-direction:column} }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="/"><img class="px" src="/bean-normal.png" width="128" height="128" alt="" aria-hidden="true">BEAN</a>
    <nav><a href="/">Home</a></nav>
  </div>
</header>
<main>
  <div class="wrap">
    <div class="panel">
      <div class="buddies">
        <img class="px" src="/pea-normal.png" width="128" height="128" alt="Pea, a small yellow bird buddy">
        <img class="px" src="/bean-normal.png" width="128" height="128" alt="Bean, a small brown capybara buddy">
      </div>
      <span class="tag">NOW ON GOOGLE PLAY</span>
      <h1>Bean is on Android.</h1>
      <p class="lead">Bean and Pea are ready for your steps. Get Bean free on Google Play, or on the App Store if you are on iPhone.</p>
      <div class="stores">
        <a class="store gplay" href="https://play.google.com/store/apps/details?id=com.drafthouse.bean" aria-label="Get it on Google Play"><img class="gp" src="/assets/google-play-icon.svg" width="26" height="29" alt=""><span><small>GET IT ON</small><b>Google Play</b></span></a>
        <a class="store" href="https://apps.apple.com/us/app/bean-moving-bean/id6769936531"><img src="/assets/app-store-badge.svg" width="162" height="54" alt="Download on the App Store"></a>
      </div>
    </div>
  </div>
</main>
<footer>
  <a href="/privacy.html">Privacy Policy</a>
  <a href="/terms.html">Terms of Service</a>
  <a href="mailto:support@moving-bean.com">Contact</a>
</footer>
</body>
</html>
